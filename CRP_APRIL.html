<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>McDonald's Optimized Race</title>
    <style>
        :root {
            --mcd-red: #DB0007;
            --mcd-gold: #FFC72C;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #111;
            color: white;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .container { display: flex; flex-direction: column; height: 100dvh; width: 100vw; }

        .header {
            background: var(--mcd-red);
            padding: 8px;
            text-align: center;
            border-bottom: 3px solid var(--mcd-gold);
            flex-shrink: 0;
        }
        .header h1 { font-size: 1rem; margin: 0; letter-spacing: 1px; }

        .track-area {
            flex: 1;
            position: relative;
            background: #1a1a1a;
            margin: 10px;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
            /* Force GPU acceleration for the whole track */
            transform: translateZ(0);
        }

        .finish-line {
            position: absolute;
            right: 60px; top: 0; bottom: 0;
            width: 25px;
            background: repeating-linear-gradient(0deg, #fff 0 10px, #000 10px 20px);
            z-index: 1; opacity: 0.2;
        }

        .racer {
            position: absolute;
            left: 0; top: 0;
            display: flex;
            align-items: center;
            z-index: 5;
            /* GPU Optimization */
            will-change: transform;
            transition: transform 0.15s ease-out;
        }

        .car { font-size: 1.5rem; filter: drop-shadow(0 2px 2px black); }
        .racer-name { 
            font-size: 0.5rem; 
            background: rgba(0,0,0,0.8); 
            padding: 2px 5px; 
            border-radius: 3px; 
            margin-left: 5px; 
            white-space: nowrap; 
            border: 1px solid #444;
        }

        .controls { padding: 15px; text-align: center; flex-shrink: 0; }
        
        .btn {
            padding: 12px 50px; 
            font-size: 1.1rem; 
            border-radius: 50px;
            border: 2px solid var(--mcd-gold); 
            font-weight: bold; 
            background: var(--mcd-red); 
            color: white;
            box-shadow: 0 4px 0 #800000;
            -webkit-tap-highlight-color: transparent;
        }

        #rotateWarning {
            position: fixed; inset: 0; background: #111; z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }

        @media screen and (orientation: portrait) { #rotateWarning { display: flex; } }

        .full-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.97);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }

        .winner-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--mcd-gold); object-fit: cover; }
        
        .summary-grid { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
        .summary-card { background: #000; padding: 10px; border-radius: 10px; border: 1px solid var(--mcd-gold); text-align: center; width: 95px; }
        .summary-card img { width: 45px; height: 45px; border-radius: 50%; }

        #standoutArea { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; display: none; width: 300px; }
        .slam-in { background: #000; border: 4px solid white; padding: 25px; border-radius: 20px; text-align: center; animation: slam 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slam { 0% { transform: scale(3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div id="rotateWarning">
    <div style="font-size: 3rem;">🏎️</div>
    <h2 style="color:var(--mcd-gold)">ROTATE SIDEWAYS</h2>
    <p>Please turn your phone for the best experience.</p>
</div>

<div class="container" id="mainUI">
    <header class="header"><h1>🍔 APRIL CRP RACE 🍟</h1></header>
    <div class="track-area" id="track">
        <div style="position:absolute; top:5px; width:100%; text-align:center; color:var(--mcd-gold); font-size:0.7rem; opacity:0.6;" id="categoryDisplay">READY?</div>
        <div class="finish-line"></div>
    </div>
    <div class="controls">
        <button class="btn" id="startBtn" onclick="startSuperRace()">START RACE</button>
    </div>
</div>

<div class="full-modal" id="winnerModal">
    <h3 id="awardTitle" style="color:var(--mcd-gold); margin:0; font-size: 1rem;"></h3>
    <div id="winnerPhotoArea" style="margin: 15px;"></div>
    <h1 id="winnerName" style="margin: 0 0 15px 0; font-size: 1.8rem;"></h1>
    <button class="btn" onclick="closeWinnerModal()">NEXT</button>
</div>

<div class="full-modal" id="finalePage">
    <h2 id="finaleTitle" style="color:var(--mcd-gold);">STATION CHAMPIONS</h2>
    <div class="summary-grid" id="summaryGrid"></div>
    <button class="btn" id="revealBtn" onclick="intenseReveal()">REVEAL STANDOUT ⭐</button>
    
    <div id="standoutArea">
        <div class="slam-in">
            <h2 style="color:var(--mcd-gold); margin:0;">🏆 THE STANDOUT 🏆</h2>
            <img id="standoutPhoto" src="" class="winner-img" style="border-color: white; margin: 15px;">
            <h1 id="standoutName" style="font-size: 1.5rem; color: white; margin-bottom:20px;"></h1>
            <button class="btn" style="background:#222; font-size:0.8rem;" onclick="location.reload()">RESTART</button>
        </div>
    </div>
</div>

<script>
    // Reduced to 30 names for absolute smoothness on mobile
    const names = ["MELCHOR", "FENNY ROGER", "JOSHUA", "RAVEN", "JENNY", "ACE", "RONALYN", "KAROL", "EMAN", "ANGELICA", "ALBERT", "JAKE", "DEXTER", "DARLENE", "MEILA", "MARY", "LEIGH", "KLARENZ", "ARVIE", "CLARENCE", "RHEALYN", "JHOAN", "DENISE", "JM", "LESTER", "EDRITCH", "KAI", "ALEX", "LAMBERT", "DAVE"];
    
    const awards = [
        { title: "RISING STAR", winner: "KEAN EGARTA", photo: "KEAN.jpg" },
        { title: "SERVICE SUNSHINE", winner: "RAVEN APOSTOL", photo: "RAVS.jpg" },
        { title: "QUALITY EXPERT", winner: "ARISTOTLE ACE", photo: "ARID.jpg" },
        { title: "CHICKEN MCDO MASTER", winner: "KLARENZ AUSTIN", photo: "KLA.jpg" }
    ];
    const standout = { name: "ARISTOTLE ACE LAXA", photo: "ARID.jpg" };

    const track = document.getElementById('track');
    const racerObjects = [];

    // Setup racers
    names.forEach((name, i) => {
        const racerDiv = document.createElement('div');
        racerDiv.className = 'racer';
        racerDiv.style.top = (5 + (i * (90 / names.length))) + "%";
        racerDiv.style.transform = `translate3d(10px, 0, 0)`;
        racerDiv.innerHTML = `<div class="car">🏎️</div><div class="racer-name">${name}</div>`;
        track.appendChild(racerDiv);
        racerObjects.push({ el: racerDiv, name: name });
    });

    let currentIdx = 0;
    const winnerLog = [];

    function startSuperRace() {
        document.getElementById('startBtn').disabled = true;
        const award = awards[currentIdx];
        document.getElementById('categoryDisplay').textContent = award.title;
        
        let startTime = Date.now();
        const duration = 10000; // 10 seconds is the sweet spot for mobile

        const raceTimer = setInterval(() => {
            let elapsed = Date.now() - startTime;
            let progress = elapsed / duration;
            let width = track.clientWidth;

            racerObjects.forEach((r) => {
                let x = progress * (width * 0.65);
                let jitter = Math.random() * 20;

                // Winner Logic
                if (progress > 0.8 && award.winner.toUpperCase().includes(r.name)) {
                    x += (progress * 80);
                }

                r.el.style.transform = `translate3d(${x + jitter}px, 0, 0)`;
            });

            if (elapsed >= duration) {
                clearInterval(raceTimer);
                setTimeout(() => {
                    winnerLog.push(award);
                    document.getElementById('awardTitle').textContent = award.title;
                    document.getElementById('winnerName').textContent = award.winner;
                    document.getElementById('winnerPhotoArea').innerHTML = `<img src="${award.photo}" class="winner-img">`;
                    document.getElementById('winnerModal').style.display = 'flex';
                }, 400);
            }
        }, 60); // 60ms interval is easier on mobile processors
    }

    function closeWinnerModal() {
        document.getElementById('winnerModal').style.display = 'none';
        currentIdx++;
        if (currentIdx < awards.length) {
            racerObjects.forEach(r => r.el.style.transform = `translate3d(10px, 0, 0)`);
            document.getElementById('startBtn').disabled = false;
        } else {
            showFinalHall();
        }
    }

    function showFinalHall() {
        document.getElementById('mainUI').style.display = 'none';
        const grid = document.getElementById('summaryGrid');
        grid.innerHTML = "";
        winnerLog.forEach(w => {
            grid.innerHTML += `<div class="summary-card">
                <div style="font-size:0.4rem; color:var(--mcd-gold); height:15px;">${w.title}</div>
                <img src="${w.photo}">
                <div style="font-size:0.5rem; margin-top:5px;">${w.winner.split(' ')[0]}</div>
            </div>`;
        });
        document.getElementById('finalePage').style.display = 'flex';
    }

    function intenseReveal() {
        document.getElementById('revealBtn').style.display = 'none';
        setTimeout(() => {
            document.getElementById('summaryGrid').style.opacity = "0.1";
            document.getElementById('finaleTitle').style.opacity = "0.1";
            document.getElementById('standoutPhoto').src = standout.photo;
            document.getElementById('standoutName').textContent = standout.name;
            document.getElementById('standoutArea').style.display = 'block';
        }, 1000);
    }
</script>
</body>
</html>
