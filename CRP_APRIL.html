<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>McDonald's CRP Race</title>
    <style>
        :root {
            --mcd-red: #DB0007;
            --mcd-gold: #FFC72C;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #111;
            color: white;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* LANDSCAPE MODE FORCED STRUCTURE */
        .container { 
            display: flex; 
            flex-direction: column; 
            height: 100dvh;
            width: 100vw;
        }

        .header {
            background: var(--mcd-red);
            padding: 5px;
            text-align: center;
            border-bottom: 3px solid var(--mcd-gold);
            flex-shrink: 0;
        }
        .header h1 { font-size: 1rem; margin: 0; letter-spacing: 2px; }

        .track-area {
            flex: 1;
            position: relative;
            background: #222;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            margin: 5px 15px;
            border: 3px solid #444;
            border-radius: 10px;
            overflow: hidden;
        }

        .finish-line {
            position: absolute;
            right: 50px; top: 0; bottom: 0;
            width: 25px;
            background: repeating-linear-gradient(0deg, #fff 0 10px, #000 10px 20px);
            z-index: 1; opacity: 0.4;
        }

        .racer {
            position: absolute; left: 10px;
            display: flex; align-items: center;
            z-index: 5;
            transition: left 0.4s linear;
        }

        .car { font-size: 1.5rem; filter: drop-shadow(0 2px 3px black); }
        .racer-name { 
            font-size: 0.5rem; 
            background: rgba(0,0,0,0.8); 
            padding: 1px 4px; 
            border-radius: 3px; 
            margin-left: 5px; 
            white-space: nowrap; 
            border: 1px solid #555;
        }

        .controls { 
            padding: 10px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .btn {
            padding: 10px 40px; 
            font-size: 1rem; 
            cursor: pointer; 
            border-radius: 50px;
            border: 3px solid var(--mcd-gold); 
            font-weight: bold; 
            background: var(--mcd-red); 
            color: white;
            box-shadow: 0 4px 0 #800000;
        }

        /* LANDSCAPE REVEAL OVERLAY */
        .full-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.95);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000;
        }

        .winner-img {
            width: 120px; height: 120px; border-radius: 50%;
            border: 4px solid var(--mcd-gold); object-fit: cover;
        }

        /* ROTATION WARNING */
        #rotateWarning {
            position: fixed; inset: 0;
            background: var(--mcd-red);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            padding: 20px;
        }

        @media screen and (orientation: portrait) {
            #rotateWarning { display: flex; }
        }

        /* FINALE LAYOUT */
        .summary-grid {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 20px;
        }
        .summary-card {
            background: #1a1a1a; padding: 10px; border-radius: 10px;
            border: 2px solid var(--mcd-gold); text-align: center; width: 100px;
        }
        .summary-card img { width: 50px; height: 50px; border-radius: 50%; }

        #standoutArea {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000; display: none; width: 300px;
        }
        .slam-in {
            background: black; border: 4px solid white; padding: 20px;
            border-radius: 20px; text-align: center;
            animation: slam 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes slam { 0% { transform: scale(5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    </style>
</head>
<body>

<!-- Portrait Warning -->
<div id="rotateWarning">
    <div style="font-size: 3rem;">🔄</div>
    <h2>PLEASE ROTATE TO LANDSCAPE</h2>
    <p>To see the race track, please turn your phone sideways.</p>
</div>

<div class="container" id="mainUI">
    <header class="header"><h1>🍔 APRIL CRP RACE 🍟</h1></header>
    <div class="track-area" id="track">
        <div style="position: absolute; left: 50%; top: 5px; transform: translateX(-50%); color: var(--mcd-gold); font-size: 0.8rem;" id="currentCategory">READY TO RACE?</div>
        <div class="finish-line"></div>
    </div>
    <div class="controls">
        <button class="btn" id="startBtn" onclick="startSuperRace()">🏁 START RACE</button>
    </div>
</div>

<div class="full-modal" id="winnerModal">
    <h3 id="awardTitle" style="color:var(--mcd-gold); margin:0;"></h3>
    <div id="winnerPhotoArea" style="margin: 10px;"></div>
    <h1 id="winnerName" style="margin: 0 0 10px 0; font-size: 1.8rem;"></h1>
    <button class="btn" onclick="closeWinnerModal()">NEXT AWARD ➡️</button>
</div>

<div class="full-modal" id="finalePage">
    <h2 id="finaleTitle" style="color:var(--mcd-gold); margin-top: 10px;">STATION WINNERS</h2>
    <div class="summary-grid" id="summaryGrid"></div>
    <button class="btn" id="revealBtn" onclick="intenseReveal()">REVEAL STANDOUT ⭐</button>
    
    <div id="standoutArea">
        <div class="slam-in">
            <h2 style="color:var(--mcd-gold); margin:0;">🏆 APRIL STANDOUT 🏆</h2>
            <img id="standoutPhoto" src="" class="winner-img" style="border-color: white; margin: 10px;">
            <h1 id="standoutName" style="font-size: 1.5rem; color: white; margin: 0 0 15px 0;"></h1>
            <button class="btn" style="font-size: 0.7rem; background: #333;" onclick="location.reload()">RESTART</button>
        </div>
    </div>
</div>

<script>
    const names = ["MELCHOR", "FENNY ROGER", "JOSHUA", "RAVEN", "JENNY", "ARISTOTLE ACE", "RONALYN", "KAROL JOSEF", "EMAN", "ANGELICA", "JOHN ALBERT", "JAKE LAWRENCE", "DEXTER", "DARLENE ANGEL", "MEILA JILL", "MARY FAITH", "LEIGH ANGELO", "KLARENZE JAKE", "ARVIE", "CLARENCE", "RHEALYN", "JHOAN QUINN", "FRANCHESKA DENISE", "JM", "LESTER", "EDRITCH JOHN", "KAI RAFAIEL", "ALEXANDRA MARIE", "LAMBERT", "JHON DAVE", "RYAN JOHN", "SHAYNE CRYSTALLINE", "RUSTOM JOHN", "ERICKSON", "ROMEO JR", "TRYCYL", "JOMARI", "AARON", "JOHN IRVIN", "JOHN MARK", "JOHN ANDREI", "CARL JAY", "JANINE", "CHRISTINE JOY", "KIMBERLY MAE", "NICOLE RICH", "JULIAN", "AUSWALD YSRAEL", "CARL RAFAEL", "JOHN MATTHEW", "MARY JANE", "LUCIA MAE", "RENZ", "ARFEL", "LAWRENCE JOED", "GLAIZA MAE", "NASH ADRIAN", "MELANIE", "MARK JEFFREY", "IRISH JOY", "JENNIE", "KRIZZANEIL GAILE"];
    const awards = [
        { title: "RISING STAR", winner: "KEAN EGARTA", photo: "KEAN.jpg" },
        { title: "SERVICE SUNSHINE", winner: "RAVEN APOSTOL", photo: "RAVS.jpg" },
        { title: "QUALITY EXPERT", winner: "ARISTOTLE LAXA", photo: "ARID.jpg" },
        { title: "CHICKEN MCDO MASTER", winner: "KLARENZ AUSTIN", photo: "KLA.jpg" }
    ];
    const standout = { name: "ARISTOTLE ACE LAXA", photo: "ARID.jpg" };

    let currentAwardIdx = 0;
    const winnerLog = [];
    const racerObjects = [];

    const track = document.getElementById('track');
    names.forEach((name, i) => {
        const racerDiv = document.createElement('div');
        racerDiv.className = 'racer';
        racerDiv.style.top = (5 + (i * (90 / names.length))) + "%"; 
        racerDiv.innerHTML = `<div class="car">🏎️</div><div class="racer-name">${name}</div>`;
        track.appendChild(racerDiv);
        racerObjects.push({ el: racerDiv, id: i });
    });

    function startSuperRace() {
        document.getElementById('startBtn').disabled = true;
        const award = awards[currentAwardIdx];
        document.getElementById('currentCategory').textContent = "RACING FOR: " + award.title;
        const winnerID = names.findIndex(n => award.winner.toUpperCase().includes(n)) || 0;
        let startTime = Date.now();
        const duration = 15000; 

        const raceInterval = setInterval(() => {
            let elapsed = Date.now() - startTime;
            let progress = elapsed / duration;
            racerObjects.forEach((r, i) => {
                let move = progress * 75;
                if (progress > 0.8) {
                    if (i === winnerID) move += (progress * 15);
                    else move -= Math.random() * 5;
                }
                r.el.style.left = Math.min(move + (Math.random() * 5), 90) + "%";
            });
            if (elapsed >= duration) {
                clearInterval(raceInterval);
                showWinner(award);
            }
        }, 80);
    }

    function showWinner(award) {
        winnerLog.push(award);
        document.getElementById('awardTitle').textContent = award.title;
        document.getElementById('winnerName').textContent = award.winner;
        document.getElementById('winnerPhotoArea').innerHTML = `<img src="${award.photo}" class="winner-img">`;
        document.getElementById('winnerModal').style.display = 'flex';
    }

    function closeWinnerModal() {
        document.getElementById('winnerModal').style.display = 'none';
        currentAwardIdx++;
        if (currentAwardIdx < awards.length) {
            racerObjects.forEach(r => r.el.style.left = "10px");
            document.getElementById('startBtn').disabled = false;
        } else {
            showFinale();
        }
    }

    function showFinale() {
        document.getElementById('mainUI').style.display = 'none';
        const grid = document.getElementById('summaryGrid');
        grid.innerHTML = "";
        winnerLog.forEach(w => {
            grid.innerHTML += `<div class="summary-card">
                <div style="font-size:0.4rem; color:var(--mcd-gold); height:20px;">${w.title}</div>
                <img src="${w.photo}">
                <div style="font-size:0.5rem; margin-top:5px;">${w.winner.split(' ')[0]}</div>
            </div>`;
        });
        document.getElementById('finalePage').style.display = 'flex';
    }

    function intenseReveal() {
        document.getElementById('revealBtn').style.display = 'none';
        document.body.style.animation = "pulseRed 0.2s infinite";
        setTimeout(() => {
            document.body.style.animation = "none";
            document.body.style.backgroundColor = "white";
            setTimeout(() => {
                document.body.style.backgroundColor = "#111";
                document.getElementById('summaryGrid').style.opacity = "0.1";
                document.getElementById('finaleTitle').style.opacity = "0.1";
                document.getElementById('standoutName').textContent = standout.name;
                document.getElementById('standoutPhoto').src = standout.photo;
                document.getElementById('standoutArea').style.display = 'block';
            }, 100);
        }, 2000);
    }
</script>
</body>
</html>
