<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>McDonald's Smooth CRP Race</title>
    <style>
        :root {
            --mcd-red: #DB0007;
            --mcd-gold: #FFC72C;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #111;
            color: white;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            /* Critical for smooth mobile scrolling/movement */
            -webkit-font-smoothing: antialiased;
            touch-action: none;
        }

        .container { 
            display: flex; 
            flex-direction: column; 
            height: 100dvh;
            width: 100vw;
        }

        .header {
            background: var(--mcd-red);
            padding: 5px;
            text-align: center;
            border-bottom: 3px solid var(--mcd-gold);
            flex-shrink: 0;
        }
        .header h1 { font-size: 0.9rem; margin: 0; letter-spacing: 1px; }

        .track-area {
            flex: 1;
            position: relative;
            background: #1a1a1a;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            margin: 10px;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            /* Hardware acceleration hint */
            transform: translateZ(0);
        }

        .finish-line {
            position: absolute;
            right: 60px; top: 0; bottom: 0;
            width: 20px;
            background: repeating-linear-gradient(0deg, #fff 0 10px, #000 10px 20px);
            z-index: 1; opacity: 0.3;
        }

        .racer {
            position: absolute;
            top: 0; left: 0;
            display: flex;
            align-items: center;
            z-index: 5;
            /* This is the secret to smoothness: */
            will-change: transform;
            transition: transform 0.1s linear; 
        }

        .car { font-size: 1.3rem; filter: drop-shadow(0 2px 2px black); }
        .racer-name { 
            font-size: 0.45rem; 
            background: rgba(0,0,0,0.7); 
            padding: 1px 3px; 
            border-radius: 2px; 
            margin-left: 4px; 
            white-space: nowrap; 
        }

        .controls { 
            padding: 10px 10px 20px 10px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .btn {
            padding: 12px 45px; 
            font-size: 1rem; 
            cursor: pointer; 
            border-radius: 50px;
            border: 2px solid var(--mcd-gold); 
            font-weight: bold; 
            background: var(--mcd-red); 
            color: white;
            box-shadow: 0 4px 0 #800000;
            -webkit-tap-highlight-color: transparent;
        }

        /* Rotation Lock Prompt */
        #rotateWarning {
            position: fixed; inset: 0;
            background: #111;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
        }

        @media screen and (orientation: portrait) {
            #rotateWarning { display: flex; }
        }

        /* Modals */
        .full-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.96);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000;
        }

        .winner-img {
            width: 110px; height: 110px; border-radius: 50%;
            border: 4px solid var(--mcd-gold); object-fit: cover;
        }

        .summary-grid {
            display: flex; justify-content: center; gap: 10px; margin: 15px 0;
        }
        .summary-card {
            background: #111; padding: 8px; border-radius: 8px;
            border: 1px solid var(--mcd-gold); text-align: center; width: 85px;
        }
        .summary-card img { width: 40px; height: 40px; border-radius: 50%; }

        #standoutArea {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000; display: none; width: 280px;
        }
        .slam-in {
            background: black; border: 3px solid white; padding: 20px;
            border-radius: 15px; text-align: center;
            animation: slam 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slam { 0% { transform: scale(3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div id="rotateWarning">
    <div style="font-size: 2rem;">🏎️</div>
    <h3 style="color:var(--mcd-gold)">ROTATE FOR WIDE TRACK</h3>
    <p style="font-size: 0.8rem;">Turn your phone sideways to start the race.</p>
</div>

<div class="container" id="mainUI">
    <header class="header"><h1>🍔 APRIL CRP RACE 🍟</h1></header>
    <div class="track-area" id="track">
        <div class="finish-line"></div>
    </div>
    <div class="controls">
        <button class="btn" id="startBtn" onclick="startSuperRace()">START RACE</button>
    </div>
</div>

<!-- Winner Popups -->
<div class="full-modal" id="winnerModal">
    <h3 id="awardTitle" style="color:var(--mcd-gold); margin:0; font-size: 0.9rem;"></h3>
    <div id="winnerPhotoArea" style="margin: 10px;"></div>
    <h1 id="winnerName" style="margin: 0 0 10px 0; font-size: 1.5rem;"></h1>
    <button class="btn" onclick="closeWinnerModal()" style="font-size: 0.8rem;">NEXT</button>
</div>

<div class="full-modal" id="finalePage">
    <h2 id="finaleTitle" style="color:var(--mcd-gold); font-size: 1.1rem;">STATION CHAMPIONS</h2>
    <div class="summary-grid" id="summaryGrid"></div>
    <button class="btn" id="revealBtn" onclick="intenseReveal()">REVEAL STANDOUT ⭐</button>
    
    <div id="standoutArea">
        <div class="slam-in">
            <h2 style="color:var(--mcd-gold); font-size: 0.9rem; margin:0;">🏆 THE STANDOUT 🏆</h2>
            <img id="standoutPhoto" src="" class="winner-img" style="border-color: white; margin: 10px;">
            <h1 id="standoutName" style="font-size: 1.3rem; color: white; margin-bottom:15px;"></h1>
            <button class="btn" style="font-size: 0.7rem; background: #222;" onclick="location.reload()">RESTART</button>
        </div>
    </div>
</div>

<script>
    const names = ["MELCHOR", "FENNY ROGER", "JOSHUA", "RAVEN", "JENNY", "ARISTOTLE ACE", "RONALYN", "KAROL JOSEF", "EMAN", "ANGELICA", "JOHN ALBERT", "JAKE LAWRENCE", "DEXTER", "DARLENE ANGEL", "MEILA JILL", "MARY FAITH", "LEIGH ANGELO", "KLARENZE JAKE", "ARVIE", "CLARENCE", "RHEALYN", "JHOAN QUINN", "FRANCHESKA DENISE", "JM", "LESTER", "EDRITCH JOHN", "KAI RAFAIEL", "ALEXANDRA MARIE", "LAMBERT", "JHON DAVE", "RYAN JOHN", "SHAYNE CRYSTALLINE", "RUSTOM JOHN", "ERICKSON", "ROMEO JR", "TRYCYL", "JOMARI", "AARON", "JOHN IRVIN", "JOHN MARK", "JOHN ANDREI", "CARL JAY", "JANINE", "CHRISTINE JOY", "KIMBERLY MAE", "NICOLE RICH", "JULIAN", "AUSWALD YSRAEL", "CARL RAFAEL", "JOHN MATTHEW", "MARY JANE", "LUCIA MAE", "RENZ", "ARFEL", "LAWRENCE JOED", "GLAIZA MAE", "NASH ADRIAN", "MELANIE", "MARK JEFFREY", "IRISH JOY", "JENNIE", "KRIZZANEIL GAILE"];
    
    const awards = [
        { title: "RISING STAR", winner: "KEAN EGARTA", photo: "KEAN.jpg" },
        { title: "SERVICE SUNSHINE", winner: "RAVEN APOSTOL", photo: "RAVS.jpg" },
        { title: "QUALITY EXPERT", winner: "ARISTOTLE LAXA", photo: "ARID.jpg" },
        { title: "CHICKEN MCDO MASTER", winner: "KLARENZ AUSTIN", photo: "KLA.jpg" }
    ];
    const standout = { name: "ARISTOTLE ACE LAXA", photo: "ARID.jpg" };

    const track = document.getElementById('track');
    const racerObjects = [];

    // Initialize racers with transform3d for GPU acceleration
    names.forEach((name, i) => {
        const racerDiv = document.createElement('div');
        racerDiv.className = 'racer';
        const topPos = (5 + (i * (90 / names.length)));
        racerDiv.style.top = topPos + "%";
        // Start position using transform
        racerDiv.style.transform = `translate3d(10px, 0, 0)`;
        racerDiv.innerHTML = `<div class="car">🏎️</div><div class="racer-name">${name}</div>`;
        track.appendChild(racerDiv);
        racerObjects.push({ el: racerDiv, winnerMatch: name });
    });

    let currentAwardIdx = 0;
    const winnerLog = [];

    function startSuperRace() {
        document.getElementById('startBtn').disabled = true;
        const award = awards[currentAwardIdx];
        const winnerName = award.winner.split(' ')[0].toUpperCase();
        
        let startTime = Date.now();
        const duration = 12000; // 12 seconds for a snappier mobile feel

        const raceInterval = setInterval(() => {
            let elapsed = Date.now() - startTime;
            let progress = elapsed / duration;
            
            const trackWidth = track.clientWidth;

            racerObjects.forEach((r) => {
                let baseMove = progress * (trackWidth * 0.7);
                let randomBoost = Math.random() * 15;
                
                // If it's the winner, give them a late boost
                if (progress > 0.8 && r.winnerMatch.includes(winnerName)) {
                    baseMove += (progress * 50);
                }

                // Apply movement via Translate3D (The "Smooth" part)
                r.el.style.transform = `translate3d(${baseMove + randomBoost}px, 0, 0)`;
            });

            if (elapsed >= duration) {
                clearInterval(raceInterval);
                setTimeout(() => showWinner(award), 500);
            }
        }, 50); // High frequency update for smoothness
    }

    function showWinner(award) {
        winnerLog.push(award);
        document.getElementById('awardTitle').textContent = award.title;
        document.getElementById('winnerName').textContent = award.winner;
        document.getElementById('winnerPhotoArea').innerHTML = `<img src="${award.photo}" class="winner-img">`;
        document.getElementById('winnerModal').style.display = 'flex';
    }

    function closeWinnerModal() {
        document.getElementById('winnerModal').style.display = 'none';
        currentAwardIdx++;
        if (currentAwardIdx < awards.length) {
            racerObjects.forEach(r => r.el.style.transform = `translate3d(10px, 0, 0)`);
            document.getElementById('startBtn').disabled = false;
        } else {
            showFinale();
        }
    }

    function showFinale() {
        document.getElementById('mainUI').style.display = 'none';
        const grid = document.getElementById('summaryGrid');
        grid.innerHTML = "";
        winnerLog.forEach(w => {
            grid.innerHTML += `<div class="summary-card">
                <div style="font-size:0.35rem; color:var(--mcd-gold); height:15px;">${w.title}</div>
                <img src="${w.photo}">
                <div style="font-size:0.45rem; margin-top:3px;">${w.winner.split(' ')[0]}</div>
            </div>`;
        });
        document.getElementById('finalePage').style.display = 'flex';
    }

    function intenseReveal() {
        document.getElementById('revealBtn').style.display = 'none';
        setTimeout(() => {
            document.getElementById('summaryGrid').style.opacity = "0.1";
            document.getElementById('finaleTitle').style.opacity = "0.1";
            document.getElementById('standoutName').textContent = standout.name;
            document.getElementById('standoutPhoto').src = standout.photo;
            document.getElementById('standoutArea').style.display = 'block';
        }, 1500);
    }
</script>
</body>
</html>
