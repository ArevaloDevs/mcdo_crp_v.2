<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>McDonald's CRP Race</title>
    <style>
        :root {
            --mcd-red: #DB0007;
            --mcd-gold: #FFC72C;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
            background: #111;
            color: white;
            overscroll-behavior: none;
        }

        .container { display: flex; flex-direction: column; height: 100vh; }

        .header {
            background: var(--mcd-red);
            padding: 10px;
            text-align: center;
            border-bottom: 4px solid var(--mcd-gold);
            z-index: 10;
        }

        .track-area {
            flex-grow: 1;
            position: relative;
            background: #222;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            margin: 10px;
            border: 4px solid #444;
            border-radius: 15px;
            overflow: hidden;
        }

        .finish-line {
            position: absolute;
            right: 40px; top: 0; bottom: 0;
            width: 30px;
            background: repeating-linear-gradient(0deg, #fff 0 15px, #000 15px 30px);
            z-index: 1; opacity: 0.5;
        }

        .racer {
            position: absolute; left: 5px;
            display: flex; align-items: center;
            z-index: 5;
            transition: left 0.5s linear, top 1.2s ease-in-out;
        }

        .car { font-size: 1.4rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        .racer-name { font-size: 0.55rem; background: rgba(0,0,0,0.8); color: #fff; padding: 1px 4px; border-radius: 3px; margin-left: 3px; white-space: nowrap; }

        .controls { padding: 15px; text-align: center; }
        
        .btn {
            padding: 12px 30px; font-size: 1.1rem; cursor: pointer; border-radius: 50px;
            border: none; font-weight: bold; background: var(--mcd-red); color: white;
            border: 3px solid var(--mcd-gold); touch-action: manipulation;
        }

        .full-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; text-align: center; padding: 20px;
        }

        .winner-img {
            width: 180px; height: 180px; border-radius: 50%;
            border: 6px solid var(--mcd-gold); object-fit: cover; margin: 15px;
        }

        .summary-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 10px; width: 100%; max-width: 600px; margin-top: 20px;
            transition: opacity 0.5s;
        }

        .summary-card {
            background: #1a1a1a; padding: 10px; border-radius: 12px;
            border: 2px solid var(--mcd-gold);
        }

        /* OVERLAY POPUP FOR STANDOUT */
        #standoutArea {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            z-index: 2000; /* Higher than everything else */
            display: none;
        }

        /* Intense Reveal Effects */
        .shake { animation: shake 0.1s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, 2px) rotate(1deg); }
        }

        .pulse-bg { animation: pulseRed 0.3s infinite; }
        @keyframes pulseRed {
            0% { background-color: #111; }
            50% { background-color: #400; }
            100% { background-color: #111; }
        }

        .slam-in { animation: slam 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slam {
            0% { transform: scale(10); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 600px) {
            #winnerName, #standoutName { font-size: 1.8rem !important; }
            .winner-img { width: 140px; height: 140px; }
        }
    </style>
</head>
<body id="mainBody">

<div class="container" id="mainUI">
    <header class="header"><h1>🍟 APRIL CRP RACE 🍔</h1></header>
    <div style="text-align: center; padding: 8px; font-size: 1rem; color: var(--mcd-gold);" id="currentCategory">READY?</div>
    <div class="track-area" id="track"><div class="finish-line"></div></div>
    <div class="controls"><button class="btn" id="startBtn" onclick="startSuperRace()">🏁 START RACE</button></div>
</div>

<!-- Standard Winner Modal -->
<div class="full-modal" id="winnerModal">
    <h2 id="awardTitle" style="color:var(--mcd-gold); font-size: 1.2rem; margin:0;"></h2>
    <div id="winnerPhotoArea"></div>
    <h1 id="winnerName" style="font-size: 2.5rem; margin: 10px 0;"></h1>
    <button class="btn" onclick="closeWinnerModal()">NEXT ➡️</button>
</div>

<!-- Finale Hall of Fame Page -->
<div class="full-modal" id="finalePage">
    <h1 id="finaleTitle" style="color:var(--mcd-gold); font-size: 1.8rem; margin:0;">APRIL CHAMPIONS</h1>
    
    <div class="summary-grid" id="summaryGrid">
        <!-- 4 Station Winners Loaded Here -->
    </div>

    <div id="revealSection" style="margin-top: 30px;">
        <button class="btn" id="revealBtn" style="background:var(--mcd-gold); color:black;" onclick="intenseReveal()">
            REVEAL STANDOUT PERFORMER ⭐
        </button>
    </div>

    <!-- FIXED POPUP AREA (Will show ABOVE the others) -->
    <div id="standoutArea">
        <div class="slam-in" style="background: #000; border: 4px solid white; border-radius: 20px; padding: 20px; box-shadow: 0 0 50px rgba(255,255,255,0.5);">
            <h2 style="color:var(--mcd-gold); font-size: 1.2rem; margin:0;">🏆 THE STANDOUT 🏆</h2>
            <img id="standoutPhoto" src="" class="winner-img" style="border-color: white;">
            <h1 id="standoutName" style="font-size: 2.2rem; margin: 0 0 20px 0; color: white;"></h1>
            <button class="btn" style="background: #444; font-size: 0.8rem; padding: 10px 20px;" onclick="location.reload()">RESTART EVENT</button>
        </div>
    </div>
</div>

<script>
    const names = ["MELCHOR", "FENNY ROGER", "JOSHUA", "RAVEN", "JENNY", "ARISTOTLE ACE", "RONALYN", "KAROL JOSEF", "EMAN", "ANGELICA", "JOHN ALBERT", "JAKE LAWRENCE", "DEXTER", "DARLENE ANGEL", "MEILA JILL", "MARY FAITH", "LEIGH ANGELO", "KLARENZE JAKE", "ARVIE", "CLARENCE", "RHEALYN", "JHOAN QUINN", "FRANCHESKA DENISE", "JM", "LESTER", "EDRITCH JOHN", "KAI RAFAIEL", "ALEXANDRA MARIE", "LAMBERT", "JHON DAVE", "RYAN JOHN", "SHAYNE CRYSTALLINE", "RUSTOM JOHN", "ERICKSON", "ROMEO JR", "TRYCYL", "JOMARI", "AARON", "JOHN IRVIN", "JOHN MARK", "JOHN ANDREI", "CARL JAY", "JANINE", "CHRISTINE JOY", "KIMBERLY MAE", "NICOLE RICH", "JULIAN", "AUSWALD YSRAEL", "CARL RAFAEL", "JOHN MATTHEW", "MARY JANE", "LUCIA MAE", "RENZ", "ARFEL", "LAWRENCE JOED", "GLAIZA MAE", "NASH ADRIAN", "MELANIE", "MARK JEFFREY", "IRISH JOY", "JENNIE", "KRIZZANEIL GAILE"];
    
    const awards = [
        { title: "RISING STAR", winner: "KEAN EGARTA", photo: "KEAN.jpg" },
        { title: "SERVICE SUNSHINE", winner: "RAVEN APOSTOL", photo: "RAVS.jpg" },
        { title: "QUALITY EXPERT", winner: "ARISTOTLE LAXA", photo: "ARID.jpg" },
        { title: "CHICKEN MCDO MASTER", winner: "KLARENZ AUSTIN", photo: "KLA.jpg" }
    ];

    const standout = { name: "ARISTOTLE ACE LAXA", photo: "ARID.jpg" };

    let currentAwardIdx = 0;
    const winnerLog = [];
    const racerObjects = [];

    const track = document.getElementById('track');
    names.forEach((name, i) => {
        const racerDiv = document.createElement('div');
        racerDiv.className = 'racer';
        racerDiv.style.top = (Math.random() * 88 + 2) + "%";
        racerDiv.innerHTML = `<div class="car">🏎️</div><div class="racer-name">${name}</div>`;
        track.appendChild(racerDiv);
        racerObjects.push({ el: racerDiv, id: i });
    });

    function startSuperRace() {
        document.getElementById('startBtn').disabled = true;
        const award = awards[currentAwardIdx];
        document.getElementById('currentCategory').textContent = award.title;
        const winnerID = names.findIndex(n => award.winner.toUpperCase().includes(n)) || 0;
        let startTime = Date.now();
        const duration = 30000; 

        const raceInterval = setInterval(() => {
            let elapsed = Date.now() - startTime;
            let progress = elapsed / duration;
            racerObjects.forEach((r, i) => {
                let move = progress * 75;
                if (Math.random() > 0.98) r.el.style.top = (Math.random() * 88 + 2) + "%";
                if (progress > 0.85) {
                    if (i === winnerID) move += (progress * 18);
                    else move -= Math.random() * 4;
                }
                r.el.style.left = Math.min(move + (Math.random() * 8), 90) + "%";
            });
            if (elapsed >= duration) {
                clearInterval(raceInterval);
                showWinner(award);
            }
        }, 120);
    }

    function showWinner(award) {
        winnerLog.push(award);
        document.getElementById('awardTitle').textContent = award.title;
        document.getElementById('winnerName').textContent = award.winner;
        document.getElementById('winnerPhotoArea').innerHTML = `<img src="${award.photo}" class="winner-img">`;
        document.getElementById('winnerModal').style.display = 'flex';
    }

    function closeWinnerModal() {
        document.getElementById('winnerModal').style.display = 'none';
        currentAwardIdx++;
        if (currentAwardIdx < awards.length) {
            racerObjects.forEach(r => r.el.style.left = "5px");
            document.getElementById('startBtn').disabled = false;
        } else {
            showFinale();
        }
    }

    function showFinale() {
        document.getElementById('mainUI').style.display = 'none';
        const grid = document.getElementById('summaryGrid');
        grid.innerHTML = "";
        winnerLog.forEach(w => {
            grid.innerHTML += `<div class="summary-card">
                <div style="font-size:0.6rem; color:var(--mcd-gold);">${w.title}</div>
                <img src="${w.photo}" style="width:50px; height:50px; border-radius:50%; border:2px solid gold; margin:5px;">
                <div style="font-size:0.7rem;">${w.winner}</div>
            </div>`;
        });
        document.getElementById('finalePage').style.display = 'flex';
    }

    function intenseReveal() {
        const btn = document.getElementById('revealBtn');
        const body = document.getElementById('mainBody');
        const page = document.getElementById('finalePage');
        
        btn.style.display = 'none';
        
        // Phase 1: Intense Shaking and Pulsing
        page.classList.add('shake');
        body.classList.add('pulse-bg');
        
        setTimeout(() => {
            // Phase 2: The Flash and Reveal
            page.classList.remove('shake');
            body.classList.remove('pulse-bg');
            body.style.backgroundColor = "white"; // White Flash
            
            setTimeout(() => {
                body.style.backgroundColor = "#111";
                document.getElementById('summaryGrid').style.opacity = "0.2"; // Dim background winners
                document.getElementById('finaleTitle').style.opacity = "0.2";
                
                document.getElementById('standoutName').textContent = standout.name;
                document.getElementById('standoutPhoto').src = standout.photo;
                document.getElementById('standoutArea').style.display = 'block';
            }, 100);
        }, 3000);
    }
</script>
</body>
</html>
