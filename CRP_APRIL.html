<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>McDonald's CRP WINNERS FOR APRIL 2026</title>
    <style>
        :root {
            --mcd-red: #DB0007;
            --mcd-gold: #FFC72C;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #111;
            color: white;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .container { display: flex; flex-direction: column; height: 100dvh; width: 100vw; }

        .header {
            background: var(--mcd-red);
            padding: 10px;
            text-align: center;
            border-bottom: 4px solid var(--mcd-gold);
            flex-shrink: 0;
        }
        .header h1 { font-size: 1.1rem; margin: 0; letter-spacing: 2px; }

        .track-area {
            flex: 1;
            position: relative;
            background: #1a1a1a;
            margin: 15px;
            border: 2px solid #444;
            border-radius: 12px;
            overflow: hidden;
            transform: translateZ(0); /* Hardware Acceleration */
        }

        .finish-line {
            position: absolute;
            right: 70px; top: 0; bottom: 0;
            width: 30px;
            background: repeating-linear-gradient(0deg, #fff 0 15px, #000 15px 30px);
            z-index: 1; opacity: 0.2;
        }

        .racer {
            position: absolute;
            left: 0; top: 0;
            display: flex;
            align-items: center;
            z-index: 5;
            will-change: transform;
            transition: transform 0.2s ease-out; /* Smooth interpolation */
        }

        .car { font-size: 1.8rem; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.5)); }
        .racer-name { 
            font-size: 0.6rem; 
            background: rgba(0,0,0,0.85); 
            padding: 3px 7px; 
            border-radius: 4px; 
            margin-left: 8px; 
            white-space: nowrap; 
            border: 1px solid var(--mcd-gold);
            color: white;
        }

        .controls { padding: 20px; text-align: center; flex-shrink: 0; }
        
        .btn {
            padding: 14px 60px; 
            font-size: 1.2rem; 
            border-radius: 50px;
            border: 2px solid var(--mcd-gold); 
            font-weight: bold; 
            background: var(--mcd-red); 
            color: white;
            box-shadow: 0 5px 0 #800000;
            -webkit-tap-highlight-color: transparent;
            active { transform: translateY(2px); box-shadow: 0 2px 0 #800000; }
        }

        #rotateWarning {
            position: fixed; inset: 0; background: #111; z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }

        @media screen and (orientation: portrait) { #rotateWarning { display: flex; } }

        /* Popups */
        .full-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }

        .winner-img { width: 140px; height: 140px; border-radius: 50%; border: 5px solid var(--mcd-gold); object-fit: cover; }
        
        .summary-grid { display: flex; justify-content: center; gap: 15px; margin: 25px 0; }
        .summary-card { background: #000; padding: 12px; border-radius: 12px; border: 2px solid var(--mcd-gold); text-align: center; width: 100px; }
        .summary-card img { width: 50px; height: 50px; border-radius: 50%; margin-bottom: 5px; }

        #standoutArea { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; display: none; width: 310px; }
        .slam-in { background: #000; border: 5px solid white; padding: 30px; border-radius: 25px; text-align: center; animation: slam 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slam { 0% { transform: scale(4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div id="rotateWarning">
    <div style="font-size: 4rem; margin-bottom: 10px;">🔄</div>
    <h2 style="color:var(--mcd-gold)">LANDSCAPE MODE REQUIRED</h2>
    <p>Please rotate your phone sideways to view the track.</p>
</div>

<div class="container" id="mainUI">
    <header class="header"><h1>CRP WINNERS OF APRIL 2026</h1></header>
    <div class="track-area" id="track">
        <div style="position:absolute; top:10px; width:100%; text-align:center; color:var(--mcd-gold); font-size:0.8rem; letter-spacing:1px;" id="categoryDisplay">TAP START TO RACE</div>
        <div class="finish-line"></div>
    </div>
    <div class="controls">
        <button class="btn" id="startBtn" onclick="startSuperRace()">START RACE</button>
    </div>
</div>

<div class="full-modal" id="winnerModal">
    <h3 id="awardTitle" style="color:var(--mcd-gold); margin:0; font-size: 1.1rem; letter-spacing: 1px;"></h3>
    <div id="winnerPhotoArea" style="margin: 20px;"></div>
    <h1 id="winnerName" style="margin: 0 0 20px 0; font-size: 2rem;"></h1>
    <button class="btn" onclick="closeWinnerModal()">NEXT AWARD</button>
</div>

<div class="full-modal" id="finalePage">
    <h2 id="finaleTitle" style="color:var(--mcd-gold); font-size: 1.5rem;">STATION WINNERS</h2>
    <div class="summary-grid" id="summaryGrid"></div>
    <button class="btn" id="revealBtn" onclick="intenseReveal()">REVEAL STANDOUT ⭐</button>
    
    <div id="standoutArea">
        <div class="slam-in">
            <h2 style="color:var(--mcd-gold); margin:0; font-size: 1rem;">🏆 APRIL STANDOUT 🏆</h2>
            <img id="standoutPhoto" src="" class="winner-img" style="border-color: white; margin: 20px;">
            <h1 id="standoutName" style="font-size: 1.6rem; color: white; margin-bottom:25px;"></h1>
            <button class="btn" style="background:#333; font-size:0.8rem;" onclick="location.reload()">RESTART</button>
        </div>
    </div>
</div>

<script>
    // EXACTLY 20 NAMES
    const names = [
        "MELCHOR", "FENNY ROGER", "JOSHUA", "RAVEN", "JENNY", 
        "ACE", "RONALYN", "KAROL", "EMAN", "ANGELICA", 
        "ALBERT", "JAKE", "DEXTER", "DARLENE", "MEILA", 
        "MARY", "LEIGH", "KLARENZ", "ARVIE", "CLARENCE"
    ];
    
    const awards = [
        { title: "RISING STAR", winner: "KEAN EGARTA", photo: "KEAN.jpg" },
        { title: "SERVICE SUNSHINE", winner: "RAVEN APOSTOL", photo: "RAVS.jpg" },
        { title: "QUALITY EXPERT", winner: "ARISTOTLE ACE", photo: "ARID.jpg" },
        { title: "CHICKEN MCDO MASTER", winner: "KLARENZ AUSTIN", photo: "KLA.jpg" }
    ];
    const standout = { name: "ARISTOTLE ACE LAXA", photo: "ARID.jpg" };

    const track = document.getElementById('track');
    const racerObjects = [];

    // Setup racers - properly spaced for 20 names
    names.forEach((name, i) => {
        const racerDiv = document.createElement('div');
        racerDiv.className = 'racer';
        racerDiv.style.top = (8 + (i * (84 / names.length))) + "%";
        racerDiv.style.transform = `translate3d(15px, 0, 0)`;
        racerDiv.innerHTML = `<div class="car">🏎️</div><div class="racer-name">${name}</div>`;
        track.appendChild(racerDiv);
        racerObjects.push({ el: racerDiv, name: name });
    });

    let currentIdx = 0;
    const winnerLog = [];

    function startSuperRace() {
        document.getElementById('startBtn').disabled = true;
        const award = awards[currentIdx];
        document.getElementById('categoryDisplay').textContent = "NOW RACING: " + award.title;
        
        let startTime = Date.now();
        const duration = 9000; // 9 seconds for high intensity

        const raceTimer = setInterval(() => {
            let elapsed = Date.now() - startTime;
            let progress = elapsed / duration;
            let width = track.clientWidth;

            racerObjects.forEach((r) => {
                let x = progress * (width * 0.6); // Base progress
                let jitter = Math.random() * 25; // Smooth vibration

                // Winner Logic - pulls ahead after 70% of the race
                if (progress > 0.7 && award.winner.toUpperCase().includes(r.name)) {
                    x += (progress * 110);
                }

                r.el.style.transform = `translate3d(${x + jitter}px, 0, 0)`;
            });

            if (elapsed >= duration) {
                clearInterval(raceTimer);
                setTimeout(() => {
                    winnerLog.push(award);
                    document.getElementById('awardTitle').textContent = award.title;
                    document.getElementById('winnerName').textContent = award.winner;
                    document.getElementById('winnerPhotoArea').innerHTML = `<img src="${award.photo}" class="winner-img">`;
                    document.getElementById('winnerModal').style.display = 'flex';
                }, 500);
            }
        }, 50); 
    }

    function closeWinnerModal() {
        document.getElementById('winnerModal').style.display = 'none';
        currentIdx++;
        if (currentIdx < awards.length) {
            racerObjects.forEach(r => r.el.style.transform = `translate3d(15px, 0, 0)`);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('categoryDisplay').textContent = "READY FOR NEXT RACE";
        } else {
            showFinalHall();
        }
    }

    function showFinalHall() {
        document.getElementById('mainUI').style.display = 'none';
        const grid = document.getElementById('summaryGrid');
        grid.innerHTML = "";
        winnerLog.forEach(w => {
            grid.innerHTML += `<div class="summary-card">
                <div style="font-size:0.45rem; color:var(--mcd-gold); height:20px; font-weight:bold;">${w.title}</div>
                <img src="${w.photo}">
                <div style="font-size:0.6rem; margin-top:5px;">${w.winner.split(' ')[0]}</div>
            </div>`;
        });
        document.getElementById('finalePage').style.display = 'flex';
    }

    function intenseReveal() {
        document.getElementById('revealBtn').style.display = 'none';
        setTimeout(() => {
            document.getElementById('summaryGrid').style.opacity = "0.2";
            document.getElementById('finaleTitle').style.opacity = "0.2";
            document.getElementById('standoutPhoto').src = standout.photo;
            document.getElementById('standoutName').textContent = standout.name;
            document.getElementById('standoutArea').style.display = 'block';
        }, 1200);
    }
</script>
</body>
</html>
